name: Update Statistics & News

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repo
        uses: actions/checkout@v5
        with:
          # A PAT (secret WORKFLOW_PAT) from a user allowed to push to `main`
          # lets us commit directly (main is protected against the default bot).
          # Falls back to GITHUB_TOKEN if the secret is absent.
          token: ${{ secrets.WORKFLOW_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Generate statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-stats.js

      - name: Generate release notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-release-notes.js

      # Redactionele koppen per release, opgehaald bij het product zelf.
      # Voedt de releasetijdlijn op de productpagina. Faalt nooit hard: is de
      # bron onbereikbaar, dan blijft de vorige data staan.
      - name: Generate release highlights (product timeline copy)
        run: node scripts/generate-release-highlights.js

      - name: Generate downloads stats (+ daily snapshot)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-downloads.js

      - name: Compute download trends (weekly deltas)
        run: node scripts/compute-download-trends.js

      - name: Update homepage tool stats (static)
        run: node scripts/build-homepage-stats.js

      # Schrijft de changelog van de nieuwste versie als statische HTML in de
      # productpagina's en stempelt softwareVersion in de JSON-LD. Zonder deze
      # stap staat die tekst alleen via JavaScript in de DOM en loopt de
      # crawlbare versie achter op wat bezoekers zien.
      - name: Render latest changelog + softwareVersion into product pages
        run: node scripts/build-release-notes-static.js

      - name: Build /api/tools.json machine-readable catalog
        run: node scripts/build-tools-api.js

      # Leest api/tools.json, dus na de vorige stap. Stond niet in deze
      # workflow, waardoor /md/ alleen bijwerkte als iemand de pijplijn
      # lokaal draaide.
      - name: Build markdown mirrors for AI assistants
        run: node scripts/build-markdown-mirrors.js

      - name: Cleanup old history (keep 90 days)
        run: |
          find data/history -name "*.json" -mtime +90 -delete 2>/dev/null || true

      - name: Commit updated data to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Nieuwe bestanden onder de gegenereerde mappen, plus alle
          # wijzigingen in reeds gevolgde bestanden — die laatste vangt de
          # productpagina's op die build-release-notes-static.js aanpast.
          git add data/ api/ md/ index.html
          git add -u
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update statistics & news $(date +%Y-%m-%d)"
          git push origin HEAD:main
