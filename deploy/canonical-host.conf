# Separate HTTPS server block for www.open-aec.com.
#
# www.open-aec.com currently serves the same site with HTTP 200, so every page
# exists twice for search engines. The canonical host is the apex
# (https://open-aec.com); this block sends www there with a permanent redirect
# and keeps the path and query string. Remove www.open-aec.com from the
# server_name of the main block once this block is active.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.open-aec.com;

    # Use the certificate the main block already uses for www.open-aec.com;
    # these paths are the usual certbot layout and may differ on the server.
    ssl_certificate     /etc/letsencrypt/live/open-aec.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/open-aec.com/privkey.pem;

    return 301 https://open-aec.com$request_uri;
}
