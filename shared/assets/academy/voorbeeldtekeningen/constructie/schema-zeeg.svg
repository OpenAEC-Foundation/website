<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" font-family="Inter, Arial, sans-serif" font-size="13">
  <title>Zeeg in een stalen ligger</title>
  <defs>
    <marker id="z-pijl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#36363E"/>
    </marker>
  </defs>
  <!-- 1. zonder belasting: met zeeg -->
  <text x="20" y="26" font-weight="700" fill="#36363E">1. Geleverd met zeeg</text>
  <path d="M40,100 Q190,60 340,100" fill="none" stroke="#36363E" stroke-width="10" stroke-linecap="round"/>
  <path d="M30,108 l10,-8 l10,8 z" fill="#36363E"/>
  <path d="M330,108 l10,-8 l10,8 z" fill="#36363E"/>
  <line x1="40" y1="100" x2="340" y2="100" stroke="#D97706" stroke-width="1.5" stroke-dasharray="6 4"/>
  <line x1="190" y1="80" x2="190" y2="100" stroke="#D97706" stroke-width="1.5"/>
  <text x="200" y="64" fill="#B45309" font-size="12" font-weight="600">zeeg, bv. 25 mm</text>
  <text x="40" y="140" fill="#52525B" font-size="12">De ligger is vooraf een beetje omhoog gebogen.</text>

  <!-- 2. belast: recht -->
  <text x="410" y="26" font-weight="700" fill="#36363E">2. Belast: recht</text>
  <g stroke="#36363E" stroke-width="1.5" marker-end="url(#z-pijl)">
    <line x1="460" y1="50" x2="460" y2="86"/><line x1="520" y1="50" x2="520" y2="86"/><line x1="580" y1="50" x2="580" y2="86"/>
    <line x1="640" y1="50" x2="640" y2="86"/><line x1="700" y1="50" x2="700" y2="86"/>
  </g>
  <line x1="430" y1="100" x2="730" y2="100" stroke="#36363E" stroke-width="10" stroke-linecap="round"/>
  <path d="M420,108 l10,-8 l10,8 z" fill="#36363E"/>
  <path d="M720,108 l10,-8 l10,8 z" fill="#36363E"/>
  <text x="430" y="140" fill="#52525B" font-size="12">Onder het gewicht van vloer en gebruik zakt hij door</text>
  <text x="430" y="156" fill="#52525B" font-size="12">tot (bijna) recht: de vloer blijft vlak.</text>

  <text x="20" y="200" fill="#36363E" font-size="13" font-weight="600">Op de tekening: achter het profiel, bijvoorbeeld</text>
  <rect x="345" y="184" width="170" height="24" rx="4" fill="#FEF3C7" stroke="#D97706"/>
  <text x="355" y="201" fill="#36363E" font-family="JetBrains Mono, Consolas, monospace" font-size="13">IPE500 (zeeg 25 mm)</text>
  <text x="20" y="232" fill="#52525B" font-size="12">Zonder zeeg zou een lange ligger zichtbaar doorbuigen, en de vloer erop ook.</text>
</svg>
