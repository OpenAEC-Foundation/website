<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 380" font-family="Inter, Arial, sans-serif" font-size="13">
  <title>Snijvlak van een constructieplattegrond</title>
  <defs>
    <pattern id="beton" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#C9C9C9"/><line x1="0" y1="0" x2="0" y2="8" stroke="#6B6B6B" stroke-width="1"/>
    </pattern>
    <marker id="pijl" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#D97706"/>
    </marker>
  </defs>

  <!-- Links: doorsnede -->
  <text x="20" y="24" font-weight="700" fill="#36363E">Doorsnede</text>
  <!-- vloer 1e verdieping -->
  <rect x="40" y="200" width="330" height="22" fill="url(#beton)" stroke="#36363E" stroke-width="2"/>
  <!-- wanden onder de vloer -->
  <rect x="60" y="222" width="18" height="120" fill="#E5E5E5" stroke="#36363E" stroke-width="1.5"/>
  <rect x="330" y="222" width="18" height="120" fill="#E5E5E5" stroke="#36363E" stroke-width="1.5"/>
  <!-- wanden boven de vloer -->
  <rect x="60" y="70" width="18" height="130" fill="#E5E5E5" stroke="#36363E" stroke-width="1.5"/>
  <rect x="200" y="70" width="18" height="130" fill="#E5E5E5" stroke="#36363E" stroke-width="1.5"/>
  <!-- maaiveld/bg vloer -->
  <line x1="30" y1="342" x2="380" y2="342" stroke="#36363E" stroke-width="2"/>
  <text x="300" y="362" fill="#52525B" font-size="12">begane grond</text>
  <text x="88" y="242" fill="#36363E" font-size="12" font-weight="600">vloer 1e verdieping</text>
  <!-- snijvlak -->
  <line x1="25" y1="186" x2="385" y2="186" stroke="#DC2626" stroke-width="2" stroke-dasharray="10 5"/>
  <text x="282" y="164" fill="#DC2626" font-size="12" font-weight="600">snijvlak</text>
  <text x="282" y="179" fill="#DC2626" font-size="11">± 50 mm boven de vloer</text>
  <!-- oog en kijkrichting -->
  <g transform="translate(270,70)">
    <ellipse cx="0" cy="0" rx="20" ry="11" fill="#fff" stroke="#36363E" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#36363E"/>
  </g>
  <line x1="270" y1="86" x2="270" y2="290" stroke="#D97706" stroke-width="2.5" marker-end="url(#pijl)"/>
  <text x="280" y="118" fill="#B45309" font-size="12" font-weight="600">je kijkt omlaag,</text>
  <text x="280" y="134" fill="#B45309" font-size="12" font-weight="600">door de vloer heen</text>

  <!-- Rechts: plattegrond -->
  <text x="470" y="24" font-weight="700" fill="#36363E">Constructieplattegrond 1e verdieping</text>
  <rect x="480" y="60" width="300" height="220" fill="#F1F1F1" stroke="#36363E" stroke-width="1"/>
  <!-- wanden boven de vloer: doorgesneden, vol -->
  <rect x="480" y="60" width="14" height="220" fill="#9A9A9A" stroke="#36363E" stroke-width="1.5"/>
  <rect x="610" y="60" width="14" height="220" fill="#9A9A9A" stroke="#36363E" stroke-width="1.5"/>
  <!-- wanden onder de vloer: gestippeld -->
  <rect x="482" y="62" width="10" height="216" fill="none" stroke="#36363E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <rect x="756" y="60" width="14" height="220" fill="none" stroke="#36363E" stroke-width="1.5" stroke-dasharray="6 4"/>
  <!-- overspanningspijl -->
  <line x1="640" y1="170" x2="745" y2="170" stroke="#36363E" stroke-width="1.5" marker-start="url(#pijl)" marker-end="url(#pijl)"/>
  <text x="652" y="162" fill="#36363E" font-size="12">KPV 200</text>
  <!-- legenda -->
  <rect x="480" y="300" width="14" height="14" fill="#9A9A9A" stroke="#36363E"/>
  <text x="502" y="312" fill="#36363E" font-size="12">wand boven de vloer: doorgesneden, vol getekend</text>
  <rect x="480" y="324" width="14" height="14" fill="none" stroke="#36363E" stroke-dasharray="4 3"/>
  <text x="502" y="336" fill="#36363E" font-size="12">wand onder de vloer: gestippeld, hierop rust de vloer</text>
  <text x="480" y="362" fill="#52525B" font-size="12">Tussen de wanden onder de vloer moet de vloer overspannen.</text>
</svg>
